; PlatformIO project configuration
; Proximity sensor test rig - ST Nucleo-F401RE (STM32F401RE, Cortex-M4F @ 84 MHz)
;
; To build:   pio run
; To flash:   pio run --target upload
; To monitor: pio device monitor
; To clean:   pio run --target clean
;
; Bring-up test (ADS1220 checks + stepper jog), built from src/bringup.cpp:
;   pio run -e nucleo_f401re_bringup --target upload
;
; Load-cell build (ADS1220 on a 4-wire bridge only), built from src/loadcell.cpp:
;   pio run -e nucleo_f401re_loadcell --target upload

[platformio]
; Plain `pio run` builds the real firmware only.
default_envs = nucleo_f401re

[env:nucleo_f401re]
; Pinned so the STM32duino core version does not move under the build.
platform  = platformio/ststm32@~19.7.1
board     = nucleo_f401re
framework = arduino

; main.cpp, bringup.cpp and loadcell.cpp each define setup()/loop(); every
; environment builds exactly one of them.
build_src_filter = +<*> -<bringup.cpp> -<loadcell.cpp>

; --- Compiler flags ---
build_flags =
    -Wall
    ; Expose include subdirs so unqualified names still resolve within each layer.
    -Iinclude/app
    -Iinclude/drivers
    -Iinclude/util
    ; The default 64 B TX ring makes Serial.write() block after half a CSV row.
    ; 1 KiB absorbs a full drain pass so loop() rarely waits on the UART.
    -DSERIAL_TX_BUFFER_SIZE=1024

; --- Upload / Monitor ---
; Flash through the on-board ST-LINK/V2-1 (SWD); no bootloader dance needed.
upload_protocol = stlink
debug_tool      = stlink

; Serial is USART2, bridged to USB by the ST-LINK virtual COM port. Match it by
; VID:PID, not a COM number: those shift between replugs.
monitor_port  = hwgrep://0483:374B
monitor_speed = 921600
monitor_filters = log2file

; --- Debug build variant ---
[env:nucleo_f401re_debug]
extends           = env:nucleo_f401re
build_flags       = ${env:nucleo_f401re.build_flags} -DDEBUG
build_unflags     = -Os
debug_build_flags = -O0 -g -ggdb

; --- Bring-up test variant ---
; DEBUG so Guard failures (e.g. which ADS1220 register read back wrong) print.
; _printf_float lets CONSOLE.printf format floats for the test report.
[env:nucleo_f401re_bringup]
extends          = env:nucleo_f401re
build_src_filter = +<*> -<main.cpp> -<loadcell.cpp>
build_flags      = ${env:nucleo_f401re.build_flags} -DDEBUG -Wl,-u,_printf_float

; --- Load-cell variant ---
; ADS1220 on a 4-wire bridge only: no stepper, no STM32 ADC, no sample timer,
; so those drivers are left out of the build.
[env:nucleo_f401re_loadcell]
extends          = env:nucleo_f401re
build_src_filter = +<*> -<main.cpp> -<bringup.cpp> -<drivers/L298NStepper.cpp>
                   -<drivers/PeriodicTimer.cpp>
